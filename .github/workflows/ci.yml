name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    # The end-to-end tests need Postgres; without it they are skipped.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: counter_drop_test
          POSTGRES_USER: counter_drop
          POSTGRES_PASSWORD: counter_drop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U counter_drop"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CD_TEST_DATABASE_URL: postgres://counter_drop:counter_drop@localhost:5432/counter_drop_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            api/go.sum
            agent/go.sum
            pkg/cdclient/go.sum
      - name: Test API
        working-directory: api
        run: go test ./...

  web:
    name: Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build PWA
        working-directory: web
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t counter-drop:ci -f Dockerfile .
