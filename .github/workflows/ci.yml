name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    # The end-to-end tests run against DynamoDB Local; without it they are skipped.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      CD_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            api/go.sum
            agent/go.sum
            pkg/cdclient/go.sum
      - name: Test API
        working-directory: api
        run: go test ./...

  web:
    name: Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build PWA
        working-directory: web
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t counter-drop:ci -f Dockerfile .
