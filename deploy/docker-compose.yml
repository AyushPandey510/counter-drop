services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter_drop
      POSTGRES_USER: counter_drop
      POSTGRES_PASSWORD: counter_drop
    ports:
      - "55433:5432"
    volumes:
      - counter_drop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter_drop"]
      interval: 5s
      retries: 10

  # Optional: only if you want to test the S3 code path locally.
  # The API uses local-disk storage by default, so this is not needed for the MVP.
  #   docker compose -f deploy/docker-compose.yml --profile s3 up -d
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: counterdrop
      MINIO_ROOT_PASSWORD: counterdrop123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - counter_drop_minio:/data

volumes:
  counter_drop_pg:
  counter_drop_minio:
