services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter_drop
      POSTGRES_USER: counter_drop
      POSTGRES_PASSWORD: counter_drop
    ports:
      - "55433:5432"
    volumes:
      - counter_drop_pg:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: counterdrop
      MINIO_ROOT_PASSWORD: counterdrop123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - counter_drop_minio:/data

volumes:
  counter_drop_pg:
  counter_drop_minio:
