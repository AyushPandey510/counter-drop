services:
  # DynamoDB Local: the whole data store in dev and tests (ADR-001). In-memory: data resets on restart.
  #   docker compose -f deploy/docker-compose.yml up -d dynamodb
  #   CD_DYNAMODB_ENDPOINT=http://localhost:8000 go run ./cmd/api     (creates the table on start)
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  # Optional: only if you want to test the S3 code path locally.
  # The API uses local-disk storage by default, so this is not needed for the MVP.
  #   docker compose -f deploy/docker-compose.yml --profile s3 up -d
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: counterdrop
      MINIO_ROOT_PASSWORD: counterdrop123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - counter_drop_minio:/data

volumes:
  counter_drop_minio:
