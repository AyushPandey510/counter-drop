# Container fallback (one VM + Caddy). Data lives in the AWS DynamoDB table named in prod.env;
# the main deployment is Lambda + CDK (ADR-001).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_OPERATOR_NAME: ${VITE_OPERATOR_NAME:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    image: counter-drop:prod
    env_file:
      - prod.env
    # Plain HTTP only on this machine: HTTPS comes from Caddy (--profile https) or your own proxy/tunnel.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - counter_drop_files:/data/files
    restart: unless-stopped

  # Automatic HTTPS (Let's Encrypt). Start with: docker compose ... --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CD_DOMAIN: ${CD_DOMAIN:-${DOMAIN:-localhost}}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  counter_drop_files:
  caddy_data:
  caddy_config:
