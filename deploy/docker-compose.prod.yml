services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: counter-drop:prod
    env_file:
      - prod.env
    environment:
      CD_DATABASE_URL: postgres://counter_drop:${POSTGRES_PASSWORD}@postgres:5432/counter_drop?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - counter_drop_files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter_drop
      POSTGRES_USER: counter_drop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - counter_drop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter_drop"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  counter_drop_pg:
  counter_drop_files:
